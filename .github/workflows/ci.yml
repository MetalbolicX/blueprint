name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Compile ReScript
        run: pnpm res:build

      - name: Bundle
        run: pnpm bundle

      - name: Run tests
        run: pnpm res:test

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Scan for committed secrets with gitleaks
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:v8.24.2
          dir /repo --no-banner --redact --exit-code 1
